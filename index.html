<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8EDF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121920" media="(prefers-color-scheme: dark)">
<title>Chauffage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EDF1; --surface:#F7F9FB; --ink:#1B2530; --muted:#5E6B78; --line:#CDD5DC;
  --heat:#E5482B; --heat-soft:rgba(229,72,43,.14); --cool:#3A78C9; --idle:#8A97A4;
  color-scheme:light;
  font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121920; --surface:#1B242D; --ink:#E6ECF1; --muted:#93A1AE; --line:#2C3843;
    --heat:#FF6A45; --heat-soft:rgba(255,106,69,.16); --cool:#5B9BEA; --idle:#6B7884; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45;
  padding:env(safe-area-inset-top,0) 0 calc(76px + env(safe-area-inset-bottom,0));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding:16px 20px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:1.5rem;font-weight:800;margin:0;letter-spacing:-.01em}
.pill{font-size:.8rem;color:var(--muted);padding:4px 10px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.pill.warn{color:var(--heat);border-color:var(--heat)}

.rooms{display:grid;grid-template-columns:1fr 1fr;margin-top:18px;background:var(--surface);border-radius:14px;padding:4px;gap:4px}
.rooms button{border:0;background:none;padding:10px;border-radius:10px;font-weight:600;color:var(--muted);display:flex;justify-content:center;gap:8px;align-items:center}
.rooms button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
.dot.on{background:var(--heat)}

[hidden]{display:none !important}
.dial{position:relative;width:min(300px,82vw);margin:22px auto 4px;touch-action:none;user-select:none}
.dial svg{display:block;width:100%;height:auto}
.dial .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.now{font-size:4.6rem;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.now sup{font-size:1.6rem;font-weight:600;vertical-align:top;margin-left:2px}
.sp{color:var(--muted);margin-top:6px}
.sp b{color:var(--ink);font-weight:600}
.knob{cursor:grab}
.adjust{display:flex;justify-content:center;gap:56px;margin-top:-6px}
.adjust button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.5rem;font-weight:600}
.status{text-align:center;margin:18px 0 0;min-height:1.5em}
.status.on{color:var(--heat)}

.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:20px}
.modes button{border:1px solid var(--line);background:none;border-radius:12px;padding:10px 4px;font-weight:600;font-size:.92rem}
.modes button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{color:var(--muted);font-size:.85rem;margin:10px 2px 0}

h2{font-size:1.1rem;margin:28px 0 10px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:12px}
.stat strong{display:block;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.8rem}
.total{margin-top:8px;color:var(--muted);font-size:.9rem}
.chart{background:var(--surface);border-radius:14px;padding:12px 8px 6px}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);padding:6px 6px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
ul.log{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:14px}
ul.log li{display:grid;grid-template-columns:52px 1fr auto;gap:10px;padding:11px 14px;border-top:1px solid var(--line);font-size:.92rem}
ul.log li:first-child{border-top:0}
ul.log time{color:var(--muted);font-variant-numeric:tabular-nums}
ul.log .t{color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:14px}

form{display:grid;gap:14px}
label{display:grid;gap:5px;font-size:.9rem;color:var(--muted)}
input[type=text],input[type=number],input[type=password],input[type=url]{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font-size:1rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;color:var(--ink)}
.check input{width:20px;height:20px}
.btns{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:13px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.alt{background:none;border:1px solid var(--line);color:var(--ink)}
.msg{font-size:.9rem;min-height:1.3em;margin:0}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 0 calc(6px + env(safe-area-inset-bottom,0));display:grid;grid-template-columns:repeat(4,1fr)}
.profline{text-align:center;color:var(--muted);font-size:.9rem;margin:4px 0 0}
.linkbtn{border:0;background:none;color:var(--cool);font-weight:600;padding:0 0 0 6px;font-size:.9rem}
.card{background:var(--surface);border-radius:16px;padding:18px;margin-top:18px}
.card .big{display:block;font-size:2.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px}
.muted{color:var(--muted)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quick button{border:1px solid var(--line);background:none;border-radius:12px;padding:13px 6px;font-weight:600}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vac{display:flex;gap:8px;align-items:end;margin-top:10px}
.vac label{flex:1}
.vac input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink)}
.block{background:var(--surface);border-radius:14px;padding:4px 14px 10px;margin-bottom:8px}
.block h3{font-size:1rem;font-weight:600;margin:12px 0 4px}
.prow{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:1.1rem;font-weight:600}
.step b{min-width:76px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.slot{display:grid;grid-template-columns:104px 1fr 36px;gap:8px;margin:6px 0}
.slot input,.slot select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;color:var(--ink);min-width:0}
.slot .x{border:0;background:none;font-size:1.3rem;color:var(--muted)}
.add{width:100%;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px;color:var(--muted);font-weight:600;margin-top:4px}
nav button{border:0;background:none;padding:10px 0;font-weight:600;color:var(--muted);font-size:.95rem}
nav button[aria-current="page"]{color:var(--ink)}
@media (prefers-reduced-motion: no-preference){ .arc{transition:stroke .4s} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Chauffage</h1>
    <span class="pill" id="conn">Mode démo</span>
  </header>

  <div class="rooms" id="rooms" role="group" aria-label="Pièce"></div>

  <!-- THERMOSTAT -->
  <section id="tab-thermo">
    <div class="dial" id="dial" aria-label="Consigne de température">
      <svg viewBox="0 0 280 280" id="dialSvg"></svg>
      <div class="center">
        <div class="now" id="now">–</div>
        <div class="sp">Consigne <b id="sp">–</b></div>
      </div>
    </div>
    <div class="adjust">
      <button id="minus" aria-label="Baisser la consigne">−</button>
      <button id="plus" aria-label="Monter la consigne">+</button>
    </div>
    <p class="status" id="status"></p>
    <p class="profline" id="profline"></p>
    <div class="modes" id="modes" role="group" aria-label="Mode"></div>
    <p class="hint" id="modeHint"></p>
  </section>

  <!-- PRÉSENCE -->
  <section id="tab-presence" hidden>
    <div class="card">
      <span class="muted">En ce moment</span>
      <span class="big" id="pName">–</span>
      <span class="muted" id="pWhy"></span>
    </div>
    <div class="quick" id="quick">
      <button data-act="home">Je suis là</button>
      <button data-act="away">Je pars</button>
      <button data-act="vacation">Vacances</button>
      <button data-act="planning">Suivre le planning</button>
    </div>
    <div class="vac" id="vacBox" hidden>
      <label class="muted">Retour le<input type="date" id="vacDate"></label>
      <button class="btn" id="vacOk" style="flex:0 0 auto">Partir</button>
    </div>
    <h2>Températures par profil</h2>
    <div id="profiles"></div>
    <h2>Planning</h2>
    <div id="planning"></div>
    <form id="schedForm" style="margin-top:14px">
      <label>Écart avant relance (°C)<input type="number" id="hyst" min="0.5" max="3" step="0.5"></label>
      <button type="submit" class="btn">Enregistrer le planning</button>
      <p class="msg" id="schedMsg"></p>
    </form>
  </section>

  <!-- INFOS -->
  <section id="tab-infos" hidden>
    <h2>Dernières 24 h</h2>
    <div class="stats">
      <div class="stat"><strong id="stTime">–</strong><span>de chauffe</span></div>
      <div class="stat"><strong id="stKwh">–</strong><span>consommés</span></div>
      <div class="stat"><strong id="stCost">–</strong><span>estimés</span></div>
    </div>
    <p class="total" id="stTotal"></p>
    <h2>Température</h2>
    <div class="chart">
      <svg viewBox="0 0 600 220" id="chart" role="img" aria-label="Courbe de température sur 24 heures"></svg>
      <div class="legend"><span><i style="background:var(--ink)"></i>Température</span><span><i style="background:var(--heat-soft);outline:1px solid var(--heat)"></i>Chauffe</span><span><i style="background:var(--muted)"></i>Consigne</span></div>
    </div>
    <h2>Déclenchements</h2>
    <ul class="log" id="log"></ul>
  </section>

  <!-- RÉGLAGES -->
  <section id="tab-reglages" hidden>
    <h2>Radiateurs</h2>
    <form id="form">
      <div class="row2">
        <label>Puissance chambre (W)<input type="number" name="p_chambre" min="0" step="50"></label>
        <label>Puissance salon (W)<input type="number" name="p_salon" min="0" step="50"></label>
      </div>
      <label>Prix du kWh (€)<input type="number" name="price" min="0" step="0.0001"></label>
      <h2 style="margin:12px 0 0">Connexion</h2>
      <label>Adresse du Worker<input type="url" name="workerUrl" placeholder="https://chauffage.nathanbbd.workers.dev"></label>
      <label>Code d’accès<input type="password" name="token" autocomplete="off"></label>
      <label class="check"><input type="checkbox" name="demo">Utiliser des données simulées</label>
      <div class="btns">
        <button type="button" class="btn alt" id="test">Tester la connexion</button>
        <button type="submit" class="btn">Enregistrer</button>
      </div>
      <p class="msg" id="msg"></p>
    </form>
  </section>
</div>

<nav>
  <button data-tab="thermo" aria-current="page">Thermostat</button>
  <button data-tab="presence">Présence</button>
  <button data-tab="infos">Infos</button>
  <button data-tab="reglages">Réglages</button>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
